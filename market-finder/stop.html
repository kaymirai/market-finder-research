<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Finder 調査停止</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #143c38;
      background: #f3faf8;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(520px, calc(100% - 48px));
      padding: 32px;
      border: 1px solid #b8d8d3;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(20 60 56 / 10%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0;
      line-height: 1.7;
    }

    #status {
      margin-top: 20px;
      padding: 14px 16px;
      border-left: 4px solid #14877d;
      background: #eaf9f5;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>EverBee調査を停止しています</h1>
    <p>重い結果画面を開かず、Chrome拡張へ停止命令を直接送ります。</p>
    <p id="status" role="status">Chrome拡張へ接続中です…</p>
  </main>

  <script>
    const PAGE_SOURCE = 'market-finder-page'
    const EXTENSION_SOURCE = 'market-finder-extension'
    const status = document.querySelector('#status')
    const requestId = `stop-${Date.now()}-${Math.random().toString(16).slice(2)}`

    const timeoutId = window.setTimeout(() => {
      status.textContent = '停止確認がタイムアウトしました。Chrome拡張を再読み込みしてください。'
    }, 10000)

    window.addEventListener('message', (event) => {
      if (event.source !== window) return
      const data = event.data
      if (data?.source !== EXTENSION_SOURCE || data.requestId !== requestId) return

      window.clearTimeout(timeoutId)
      if (data.ok === false) {
        status.textContent = `停止できませんでした: ${data.error || 'Chrome拡張から応答がありません'}`
        return
      }

      const state = data.state ?? data.response?.state ?? {}
      status.textContent = state.active
        ? '停止命令を送信しましたが、まだ実行中です。'
        : '停止しました。EverBeeの連続検索は終了しています。'
    })

    window.setTimeout(() => {
      window.postMessage({
        source: PAGE_SOURCE,
        action: 'STOP_MARKET_RESEARCH',
        requestId,
      }, window.location.origin)
    }, 500)
  </script>
</body>
</html>
